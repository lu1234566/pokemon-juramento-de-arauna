name: Integrate Arauna maps and build test ROM

on:
  push:
    branches:
      - feature/integrate-arauna-concept-maps-20260909

permissions:
  contents: write

jobs:
  integrate-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and verify base map overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .integration_payload/part_* > /tmp/arauna_overlay.b64
          base64 -d /tmp/arauna_overlay.b64 > /tmp/arauna_overlay.tar.xz
          echo "d089b07ab3eea3b8b0db742c87efa5e6c0775b3eb208ea55c7ab86b9c96fc0fb  /tmp/arauna_overlay.tar.xz" | sha256sum -c -
          tar -xJf /tmp/arauna_overlay.tar.xz

      - name: Reconstruct and apply Pampa interiors V1
        shell: bash
        run: |
          set -euo pipefail
          cat .integration_payload_pampa/part_* > /tmp/pampa_interiores.b64
          base64 -d /tmp/pampa_interiores.b64 > /tmp/pampa_interiores.tar.xz
          echo "8138322cb121ddafe54fb77deaa4871f458615f184b97d531f4494666b58bbb1  /tmp/pampa_interiores.tar.xz" | sha256sum -c -
          tar -xJf /tmp/pampa_interiores.tar.xz

      - name: Validate integrated maps and JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          count = 0
          for root in (Path('data'), Path('src')):
              for path in root.rglob('*.json'):
                  json.loads(path.read_text(encoding='utf-8'))
                  count += 1

          expected = {
              'PetalburgCity_Gym': 'LAYOUT_ARAUNA_PAMPA_GYM',
              'PetalburgCity_House1': 'LAYOUT_ARAUNA_PAMPA_HOUSE1',
              'PetalburgCity_House2': 'LAYOUT_ARAUNA_PAMPA_HOUSE2',
              'PetalburgCity_WallysHouse': 'LAYOUT_ARAUNA_PAMPA_WALLYSHOUSE',
              'PetalburgCity_Mart': 'LAYOUT_ARAUNA_PAMPA_MART',
              'PetalburgCity_PokemonCenter_1F': 'LAYOUT_ARAUNA_PAMPA_POKEMONCENTER_1F',
              'PetalburgCity_PokemonCenter_2F': 'LAYOUT_ARAUNA_PAMPA_POKEMONCENTER_2F',
          }
          for name, layout in expected.items():
              path = Path('data/maps') / name / 'map.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data['layout'] == layout, (name, data['layout'], layout)

          for bank in ('galpao', 'casas', 'venda', 'centro'):
              base = Path('data/tilesets/secondary') / f'arauna_pampa_{bank}'
              for rel in ('tiles.png', 'metatiles.bin', 'metatile_attributes.bin'):
                  assert (base / rel).is_file(), base / rel

          print(f'Integrated JSON validation PASS: {count} files; Pampa interiors 7/7')
          PY

      - name: Work around pre-existing empty text-width measurement bug
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/arauna/check_text_width.py')
          s = p.read_text(encoding='utf-8')
          old = '        cap = max(width for width, _ in measure(ruler, original))'
          new = '        cap = max((width for width, _ in measure(ruler, original)), default=0)'
          if old not in s:
              raise SystemExit('Expected pre-existing text-width line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          for file in /etc/apt/sources.list.d/*; do
            if [ -f "$file" ] && grep -q 'dl.google.com/linux/chrome-stable' "$file"; then
              sudo rm -f "$file"
            fi
          done
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build Arauna English test ROM
        run: bash scripts/build_arauna.sh -j2 all

      - name: Hash test ROM
        run: sha256sum pokemon-juramento-de-arauna-en_modern.gba | tee ROM_SHA256.txt

      - name: Publish test ROM
        uses: actions/upload-artifact@v4
        with:
          name: arauna-maps-pampa-interiors-test-rom
          path: |
            pokemon-juramento-de-arauna-en_modern.gba
            ROM_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit integrated map sources
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- tools/arauna/check_text_width.py
          rm -rf .integration_payload .integration_payload_pampa
          rm -f .github/workflows/integrate-arauna-maps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Arauna concept maps through Pampa interiors V1"
          git push origin HEAD:feature/integrate-arauna-concept-maps-20260909
