name: Prepare vanilla Pokemon Emerald reset

on:
  push:
    paths:
      - .github/workflows/reset-to-vanilla-emerald.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    if: github.repository == 'lu1234566/pokemon-juramento-de-arauna'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve pre-reset state
        shell: bash
        run: |
          set -euo pipefail
          git branch -f archive/pre-emerald-reset-2026-08-17 "$GITHUB_SHA"
          git push origin archive/pre-emerald-reset-2026-08-17 --force

      - name: Fetch official vanilla Emerald source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/pret/pokeemerald.git /tmp/pokeemerald

      - name: Build clean vanilla branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -C reset/vanilla-emerald
          rsync -a --delete --exclude='.git' /tmp/pokeemerald/ ./
          diff -qr --exclude=.git . /tmp/pokeemerald
          grep -F 'f3ae088181bf583e55daf962a92bb46f4f1d07b7' rom.sha1
          grep -F 'Pokémon Emerald' README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reset project to vanilla Pokemon Emerald'
          git push origin HEAD:reset/vanilla-emerald --force
