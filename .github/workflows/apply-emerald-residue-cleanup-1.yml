name: Apply Emerald residue cleanup 1

on:
  push:
    branches:
      - narrative/emerald-residue-cleanup-1-2026-08-17

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: narrative/emerald-residue-cleanup-1-2026-08-17
          fetch-depth: 0

      - name: Apply and verify Arauna sign cleanup
        run: |
          python3 tools/cleanup_emerald_residue_signs.py
          python3 tools/cleanup_emerald_residue_signs.py --check

      - name: Remove one-shot workflow and commit generated source changes
        run: |
          git rm .github/workflows/apply-emerald-residue-cleanup-1.yml
          git add data/maps tools/cleanup_emerald_residue_signs.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace Emerald gym signs with Arauna identities"
          git push origin HEAD:narrative/emerald-residue-cleanup-1-2026-08-17
