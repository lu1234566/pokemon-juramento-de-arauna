name: Materialize Arauna polish assets

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: arauna-polish-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/arauna-assets-ram-polish-2026-10-12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install palette image support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
      - name: Generate and verify authored native assets
        run: |
          python3 tools/arauna/fit_sprite_coordinates.py --write
          python3 tools/arauna/build_ui_labels.py --write
          python3 tools/arauna/build_native_cries.py --write
          python3 tools/arauna/check_ram_budget.py
          python3 tools/arauna/fit_sprite_coordinates.py
          python3 tools/arauna/build_ui_labels.py
          python3 tools/arauna/build_native_cries.py
      - name: Preserve generated source assets on the isolated fix branch
        run: |
          git add src/data/pokemon_graphics/front_pic_coordinates.h src/data/pokemon_graphics/back_pic_coordinates.h src/battle_anim_mons.c graphics/pokenav/options/hoenn_map.png graphics/pokenav/left_headers/hoenn_map.png sound/direct_sound_samples/cries/arauna sound/arauna_cries.json src/data/arauna_cries.h
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Materialize reproducible Arauna sprite, label and cry assets"
            git push origin HEAD:codex/arauna-assets-ram-polish-2026-10-12
          fi
