name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arauna-static-validation:
    name: repository-safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          # Width/save-layout gates read pinned historical commits with git show.
          fetch-depth: 0

      - name: Install host sprite validation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Validate canonical English rendered composition
        run: bash scripts/check_arauna_static.sh

  build:
    name: Build Arauna English ROM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build English-only Arauna ROM
        run: |
          set -o pipefail
          bash scripts/build_arauna.sh -j2 all 2>&1 | tee arauna-build.log
          if rg -i '\bwarning:' arauna-build.log; then
            echo "Compiler/assembler warnings are not allowed in the Arauna release build."
            exit 1
          fi

      - name: Export engine symbols for verification
        run: arm-none-eabi-nm -n pokemon-juramento-de-arauna-en_modern.elf > arauna-en.symbols.txt

      - name: Record the release ROM checksum
        run: sha256sum pokemon-juramento-de-arauna-en_modern.gba > arauna-en.sha256.txt

      # The job built a playable ROM and then threw it away. Keep it.
      - name: Publish the ROM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: pokeemerald-en-gba
          path: |
            pokemon-juramento-de-arauna-en_modern.gba
            arauna-en.symbols.txt
            arauna-en.sha256.txt
            arauna-build.log
          if-no-files-found: error
          retention-days: 30

  build-and-test:
    name: build-and-test
    if: always()
    needs: [arauna-static-validation, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation and English build
        env:
          SAFETY_RESULT: ${{ needs.arauna-static-validation.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$SAFETY_RESULT" = "success"
          test "$BUILD_RESULT" = "success"

