name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arauna-static-validation:
    name: repository-safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify English-only project policy
        run: python3 scripts/check_english_only_policy.py

      - name: Verify Weather Institute 1F English surface
        run: python3 scripts/check_weather_institute_1f_en.py

      - name: Verify Weather Institute 2F English surface
        run: python3 scripts/check_weather_institute_2f_en.py

      - name: Verify shared English faction trainer names
        run: python3 scripts/render_shared_trainer_names_en.py --check

      - name: Verify Horizon forest English overlay
        run: python3 scripts/render_petalburg_woods_surface.py --check

      - name: Verify Route 119 Ciro and Seu Bento English surface
        run: python3 scripts/render_route119_ciro_surface_en.py --check

      - name: Verify Baia das Luzes Ciro English encounter
        run: python3 scripts/render_baia_luzes_ciro_en.py --check

      - name: Verify Baia das Luzes common English surface
        run: python3 scripts/render_baia_luzes_surface_en_checked.py --check

      - name: Verify Serra da Cinza English overlay
        run: python3 scripts/render_mt_chimney_surface.py --check

      - name: Verify Mata do Meio and Lidia English overlay
        run: python3 scripts/render_mata_do_meio_lidia_en.py --check

      - name: Verify Ruinas and Memorial English overlay
        run: python3 scripts/render_ruins_memorial_en.py --check

      - name: Verify Route 120 Bento English bridge
        run: python3 scripts/render_route120_bento_en.py --check

      - name: Verify Central Archive English overlay
        run: python3 scripts/render_central_archive_en.py --check

      - name: Verify Route 121 Memorial English bridge
        run: python3 scripts/render_route121_memorial_en.py --check

      - name: Verify M'Boi climax English overlay
        run: python3 scripts/render_mboi_climax_en.py --check

      - name: Verify Aguas de M'Boi English overlay
        run: python3 scripts/render_aguas_mboi_en_checked.py --check

      - name: Verify Memorial lower floors English overlay
        run: python3 scripts/render_memorial_lower_floors_en.py --check

      - name: Verify Memorial mid floors English overlay
        run: python3 scripts/render_memorial_mid_floors_en.py --check

      - name: Verify lower Remembrancers base English overlay
        run: python3 scripts/render_remembrancers_lower_en.py --check

      - name: Verify upper Remembrancers base English overlay
        run: python3 scripts/render_remembrancers_core_en.py --check

      - name: Verify Missoes do Ceu 1F English overlay
        run: python3 scripts/render_missoes_ceu_ground_floor_en.py --check

      - name: Verify Missoes do Ceu 2F English overlay
        run: python3 scripts/render_missoes_ceu_confrontation_en.py --check

      - name: Verify Porto do Sal museum people English overlay
        run: python3 scripts/render_porto_sal_museum_people_en_checked.py --check

      - name: Verify Porto do Sal museum science English overlay
        run: python3 scripts/render_porto_sal_museum_science_en_checked.py --check

      - name: Verify Porto do Sal museum confrontation English overlay
        run: python3 scripts/render_porto_sal_museum_confrontation_en_checked.py --check

      - name: Verify Porto do Sal submarine English overlay
        run: python3 scripts/render_porto_sal_submersivel_en.py --check

      - name: Verify Porto do Sal daily-life English overlay
        run: python3 scripts/render_porto_sal_daily_life_en.py --check

      - name: Verify Porto do Sal shipyard English overlay
        run: python3 scripts/render_porto_sal_shipyard_en.py --check

      - name: Verify Porto do Sal harbor-service English overlay
        run: python3 scripts/render_porto_sal_harbor_service_en.py --check

      - name: Verify no proprietary files
        run: bash scripts/check_no_proprietary_files.sh

  build:
    name: Build Arauna English ROM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build English-only Arauna ROM
        run: bash scripts/build_arauna.sh -j2 all

  build-and-test:
    name: build-and-test
    if: always()
    needs: [arauna-static-validation, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation and English build
        env:
          SAFETY_RESULT: ${{ needs.arauna-static-validation.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$SAFETY_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
