name: Project CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_VERSION: EMERALD
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run repository-safety suite
        run: bash scripts/run_repository_safety.sh repository-safety.log
      - name: Upload repository-safety diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-safety-log
          path: repository-safety.log
          if-no-files-found: warn

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            pkg-config \
            python3

      - name: Cache generated build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: arauna-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build English Emerald
        run: |
          set -o pipefail
          make ARAUNA_LANGUAGE=ENGLISH -j$(nproc) -O all 2>&1 | tee build.log

      - name: Run engine tests
        env:
          TEST: 1
        run: |
          set -o pipefail
          make ARAUNA_LANGUAGE=ENGLISH -j$(nproc) check 2>&1 | tee engine-tests.log

      - name: Confirm English ROM exists locally
        run: test -f pokeemerald-en.gba

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: |
            build.log
            engine-tests.log
          if-no-files-found: warn
