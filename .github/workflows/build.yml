name: Project CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_VERSION: EMERALD
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject ROMs, saves, patches and secrets
        run: bash scripts/check_no_proprietary_files.sh
      - name: Validate localized text sources
        run: python3 scripts/check_localization.py
      - name: Validate English runtime
        run: python3 tools/arauna/validate_english_runtime.py
      - name: Validate packed Arauna Fakemon Dex
        run: python3 tools/arauna/validate_packed_arauna_dex.py
      - name: Validate vertical slice map shells
        run: python3 scripts/validate_vertical_slice_shells.py
      - name: Verify reproducible vanilla Araucaria village
        run: |
          python3 scripts/generate_arauna_vanilla_village.py --out /tmp/arauna-village-map.bin
          cmp /tmp/arauna-village-map.bin data/layouts/AraunaMapLab/map.bin
      - name: Validate Arauna opening flow
        run: python3 scripts/validate_arauna_opening.py
      - name: Validate Mist Route story
        run: python3 scripts/validate_mist_route_story.py
      - name: Validate First Link choice
        run: python3 scripts/validate_first_link_choice.py
      - name: Validate First Link chamber
        run: python3 scripts/validate_first_link_chamber.py
      - name: Validate vertical-slice epilogue
        run: python3 scripts/validate_vertical_slice_epilogue.py
      - name: Validate Porto das Redes map reuse
        run: python3 scripts/validate_arauna_porto_reuse.py
      - name: Validate Serra do Uivo map reuse
        run: python3 scripts/validate_arauna_serra_reuse.py
      - name: Validate second ROM test package
        run: python3 scripts/validate_second_rom_test.py
      - name: Validate story-masked badge trials
        run: python3 scripts/validate_masked_badge_trials.py
      - name: Validate Mist Route encounters
        run: python3 scripts/validate_mist_route_encounters.py
      - name: Validate capture onboarding
        run: python3 scripts/validate_capture_onboarding.py
      - name: Validate safe recovery
        run: python3 scripts/validate_safe_recovery.py
      - name: Validate Araucaria art assets
        run: python3 scripts/validate_araucaria_art.py
      - name: Validate Codespaces configuration
        run: |
          python3 -m json.tool .devcontainer/devcontainer.json >/dev/null
          bash -n .devcontainer/setup-visual-tools.sh
          bash -n scripts/open_visual_tools.sh

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            pkg-config \
            python3

      - name: Cache generated build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: arauna-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build English Emerald
        run: make ARAUNA_LANGUAGE=ENGLISH -j$(nproc) -O all


      - name: Run engine tests
        env:
          TEST: 1
        run: make ARAUNA_LANGUAGE=ENGLISH -j$(nproc) check

      - name: Confirm English ROM exists locally
        run: test -f pokeemerald-en.gba
