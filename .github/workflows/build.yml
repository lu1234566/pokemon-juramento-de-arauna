name: Project CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_VERSION: EMERALD
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject ROMs, saves, patches and secrets
        run: bash scripts/check_no_proprietary_files.sh
      - name: Validate localized text sources
        run: python3 scripts/check_localization.py
      - name: Validate vertical slice map shells
        run: python3 scripts/validate_vertical_slice_shells.py
      - name: Validate Araucaria art assets
        run: python3 scripts/validate_araucaria_art.py
      - name: Validate Codespaces configuration
        run: |
          python3 -m json.tool .devcontainer/devcontainer.json >/dev/null
          bash -n .devcontainer/setup-visual-tools.sh
          bash -n scripts/open_visual_tools.sh

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            pkg-config \
            python3

      - name: Cache generated build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: arauna-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build English Emerald
        run: make ARAUNA_LANGUAGE=ENGLISH -j$(nproc) -O all

      - name: Build Portuguese Emerald
        run: make ARAUNA_LANGUAGE=PORTUGUESE -j$(nproc) -O all

      - name: Run engine tests
        env:
          TEST: 1
        run: make ARAUNA_LANGUAGE=ENGLISH -j$(nproc) check

      - name: Confirm both generated ROMs exist locally
        run: |
          test -f pokeemerald-en.gba
          test -f pokeemerald-ptbr.gba
