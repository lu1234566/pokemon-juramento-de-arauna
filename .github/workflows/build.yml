name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arauna-static-validation:
    name: repository-safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical English rendered composition
        run: bash scripts/check_arauna_static.sh

  build:
    name: Build Arauna English ROM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build English-only Arauna ROM
        run: bash scripts/build_arauna.sh -j2 all

  build-and-test:
    name: build-and-test
    if: always()
    needs: [arauna-static-validation, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation and English build
        env:
          SAFETY_RESULT: ${{ needs.arauna-static-validation.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$SAFETY_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
