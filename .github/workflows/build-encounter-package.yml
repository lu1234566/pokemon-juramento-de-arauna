name: Build Arauna encounter v2 package

on:
  push:
    branches:
      - feat/fairy-moves-animations
    paths:
      - "tools/arauna/build_encounter_package.py"
      - ".github/workflows/build-encounter-package.yml"
      - "tools/arauna/package_sources/lovable/pokedex.ts"
      - "docs/arauna/ARAUNA_DEX_ENGINE_MAPPING.csv"
      - "docs/arauna/ARAUNA_EVOLUTIONS.csv"
      - "src/data/wild_encounters.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build encounter table v2
        run: |
          python3 tools/arauna/build_encounter_package.py dist/Arauna_Encounter_Table_v2
          cd dist
          zip -r Arauna_Encounter_Table_v2.zip Arauna_Encounter_Table_v2
      - uses: actions/upload-artifact@v4
        with:
          name: Arauna_Encounter_Table_v2
          path: dist/Arauna_Encounter_Table_v2.zip
          if-no-files-found: error
          retention-days: 30
