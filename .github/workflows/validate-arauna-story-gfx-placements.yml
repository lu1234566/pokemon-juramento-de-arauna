name: Validate Arauna story graphics placements

on:
  push:
    branches:
      - visual/arauna-dedicated-overworld-slots-2026-08-17

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Apply story graphics placements
        run: python3 tools/apply_arauna_story_gfx_placements.py

      - name: Validate map scope
        run: |
          python3 - <<'PY'
          import json
          checks = {
              'data/maps/MtPyre_Summit/map.json': ('local_id', 'LOCALID_MT_PYRE_SUMMIT_OLD_LADY', 'OBJ_EVENT_GFX_DONA_ZILA'),
              'data/maps/LilycoveCity/map.json': ('script', 'LilycoveCity_EventScript_Rival', 'OBJ_EVENT_GFX_CIRO_CONSORCIO'),
              'data/maps/EverGrandeCity_ChampionsRoom/map.json': ('local_id', 'LOCALID_CHAMPIONS_ROOM_RIVAL', 'OBJ_EVENT_GFX_CIRO_FINAL'),
          }
          for path, (key, value, gfx) in checks.items():
              data = json.load(open(path, encoding='utf-8'))
              matches = [obj for obj in data['object_events'] if obj.get(key) == value]
              assert len(matches) == 1, (path, key, value, len(matches))
              assert matches[0]['graphics_id'] == gfx, (path, matches[0]['graphics_id'], gfx)
              print(path, value, '->', gfx)
          PY
          git diff --check
          git diff -- data/maps/MtPyre_Summit/map.json data/maps/LilycoveCity/map.json data/maps/EverGrandeCity_ChampionsRoom/map.json

      - name: Build custom Emerald ROM
        env:
          MODERN: 1
          COMPARE: 0
        run: make -j2 all

      - name: Publish validated map placements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/apply_arauna_story_gfx_placements.py
          git rm -f .github/workflows/validate-arauna-story-gfx-placements.yml
          git add data/maps/MtPyre_Summit/map.json \
                  data/maps/LilycoveCity/map.json \
                  data/maps/EverGrandeCity_ChampionsRoom/map.json \
                  docs/ARAUNA_STORY_GFX_PLACEMENTS.md
          git commit -m "Place Zila and Ciro phase graphics in story events"
          git push origin HEAD:${GITHUB_REF_NAME}
