name: Apply Emerald residue cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: startsWith(github.head_ref, 'narrative/emerald-residue-run-') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and verify Arauna residue cleanup
        run: |
          python3 tools/cleanup_emerald_residue_signs.py
          python3 tools/cleanup_emerald_residue_signs.py --check
          python3 tools/cleanup_match_call_residue.py
          python3 tools/cleanup_match_call_residue.py --check
          python3 tools/cleanup_ciro_route_residue.py
          python3 tools/cleanup_ciro_route_residue.py --check
          python3 tools/cleanup_littleroot_house_residue.py
          python3 tools/cleanup_littleroot_house_residue.py --check
          python3 tools/cleanup_battle_message_residue.py
          python3 tools/cleanup_battle_message_residue.py --check
          python3 tools/cleanup_vila_amanhecer_residue.py
          python3 tools/cleanup_vila_amanhecer_residue.py --check
          python3 tools/cleanup_intro_speech_residue.py
          python3 tools/cleanup_intro_speech_residue.py --check
          python3 tools/cleanup_region_map_names.py
          python3 tools/cleanup_region_map_names.py --check
          python3 tools/cleanup_system_ui_identity.py
          python3 tools/cleanup_system_ui_identity.py --check
          python3 tools/cleanup_route119_surface_residue.py
          python3 tools/cleanup_route119_surface_residue.py --check
          python3 tools/cleanup_val_household_residue.py
          python3 tools/cleanup_val_household_residue.py --check
          python3 tools/cleanup_pokedex_rating_residue.py
          python3 tools/cleanup_pokedex_rating_residue.py --check

      - name: Commit generated source changes
        run: |
          git add data/maps data/text src/strings.c src/battle_message.c src/data/region_map/region_map_sections.json
          if git diff --cached --quiet; then
            echo "No generated residue-cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply Arauna visible-residue cleanup"
          git push origin HEAD:${{ github.head_ref }}