name: Validate published city remodel

on:
  push:
    paths:
      - .github/workflows/validate-published-city-remodel.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published main
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev
      - name: Build published Emerald state
        env:
          MODERN: 1
          COMPARE: 0
        run: make -j2 all
