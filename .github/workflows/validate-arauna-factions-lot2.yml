name: Validate Arauna faction graphics lot 2

on:
  push:
    branches:
      - visual/arauna-factions-lot2-2026-08-17

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Decode and verify exact faction sprites
        run: |
          mkdir -p /tmp/arauna-factions
          base64 -d .tmp/arauna-factions-lot2/aqua_member_m.b64 > /tmp/arauna-factions/aqua_member_m.png
          base64 -d .tmp/arauna-factions-lot2/aqua_member_f.b64 > /tmp/arauna-factions/aqua_member_f.png
          base64 -d .tmp/arauna-factions-lot2/magma_member_m.b64 > /tmp/arauna-factions/magma_member_m.png
          base64 -d .tmp/arauna-factions-lot2/magma_member_f.b64 > /tmp/arauna-factions/magma_member_f.png

          echo '9b03d968dcc6ca3692483146776243864d1f9e3e53f08166c6257ac5fa1196a1  /tmp/arauna-factions/aqua_member_m.png' | sha256sum -c -
          echo '078f790b1bb173fdebe1241cbb48d67cd65753155729dc1808d1d0dfd62208f6  /tmp/arauna-factions/aqua_member_f.png' | sha256sum -c -
          echo '80bb81b0e9359532c6f14ed5a15354aa292bc09763ad82007fee5b605c90088b  /tmp/arauna-factions/magma_member_m.png' | sha256sum -c -
          echo 'dd9e4060d9f7259ff6f75ad8f084c5a82d02174c78c9490d51ff8fe7099e3ee1  /tmp/arauna-factions/magma_member_f.png' | sha256sum -c -

          cp /tmp/arauna-factions/aqua_member_m.png graphics/object_events/pics/people/team_aqua/aqua_member_m.png
          cp /tmp/arauna-factions/aqua_member_f.png graphics/object_events/pics/people/team_aqua/aqua_member_f.png
          cp /tmp/arauna-factions/magma_member_m.png graphics/object_events/pics/people/team_magma/magma_member_m.png
          cp /tmp/arauna-factions/magma_member_f.png graphics/object_events/pics/people/team_magma/magma_member_f.png

      - name: Validate graphics scope
        run: |
          test -s graphics/object_events/pics/people/team_aqua/aqua_member_m.png
          test -s graphics/object_events/pics/people/team_aqua/aqua_member_f.png
          test -s graphics/object_events/pics/people/team_magma/magma_member_m.png
          test -s graphics/object_events/pics/people/team_magma/magma_member_f.png
          git diff --check
          git status --short

      - name: Build custom Emerald ROM
        env:
          MODERN: 1
          COMPARE: 0
        run: make -j2 all

      - name: Document faction graphics mapping
        run: |
          cat > docs/ARAUNA_FACTION_GFX.md <<'EOF'
          # Arauna faction overworld graphics

          This visual layer reuses the original Emerald Team Aqua and Team Magma object-event slots so every inherited encounter automatically follows Arauna's rewritten faction identities without changing map scripts or progression.

          | Emerald graphics slot | Arauna visual identity |
          | --- | --- |
          | `OBJ_EVENT_GFX_AQUA_MEMBER_M` | HORIZONTE / Consórcio security agent |
          | `OBJ_EVENT_GFX_AQUA_MEMBER_F` | HORIZONTE / Consórcio field technician |
          | `OBJ_EVENT_GFX_MAGMA_MEMBER_M` | Lembrante field member |
          | `OBJ_EVENT_GFX_MAGMA_MEMBER_F` | Lembrante field worker |

          All four sheets preserve Emerald's 144x32 / 16x32-frame structure and use the runtime palettes already assigned to those slots. No event coordinates, flags, trainer data, warps, scripts, route order or story control flow are changed.
          EOF

      - name: Publish validated faction sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .tmp/arauna-factions-lot2
          git rm -f .github/workflows/validate-arauna-factions-lot2.yml
          git add graphics/object_events/pics/people/team_aqua/aqua_member_m.png \
                  graphics/object_events/pics/people/team_aqua/aqua_member_f.png \
                  graphics/object_events/pics/people/team_magma/magma_member_m.png \
                  graphics/object_events/pics/people/team_magma/magma_member_f.png \
                  docs/ARAUNA_FACTION_GFX.md
          git add -u .tmp/arauna-factions-lot2
          git commit -m "Replace inherited faction overworld graphics with Arauna identities"
          git push origin HEAD:${GITHUB_REF_NAME}
