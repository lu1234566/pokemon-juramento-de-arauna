name: Integrate priority-10 NPC v3

on:
  push:
    branches:
      - agent/integrate-priority10-npcs-v3
  pull_request:
    branches:
      - agent/playtest-feedback-world-progression
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-priority10-npcs-v3
  cancel-in-progress: false

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/integrate-priority10-npcs-v3
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            pkg-config \
            python3

      - name: Decode approved NPC assets
        run: |
          mkdir -p graphics/object_events/pics/people/arauna
          mkdir -p graphics/trainers/front_pics
          for file in .integration/npc_v3/overworld/*.b64; do
            name="$(basename "$file" .b64)"
            base64 --decode "$file" > "graphics/object_events/pics/people/arauna/$name"
          done
          base64 --decode .integration/npc_v3/trainer/professora_anahi.png.b64 > graphics/trainers/front_pics/salon_maiden_anabel.png
          base64 --decode .integration/npc_v3/trainer/ciro_prologo.png.b64 > graphics/trainers/front_pics/dome_ace_tucker.png
          base64 --decode .integration/npc_v3/trainer/ciro_consorcio.png.b64 > graphics/trainers/front_pics/factory_head_noland.png
          base64 --decode .integration/npc_v3/trainer/dona_celina.png.b64 > graphics/trainers/front_pics/arena_tycoon_greta.png
          base64 --decode .integration/npc_v3/trainer/agente_conformidade.png.b64 > graphics/trainers/front_pics/pike_queen_lucy.png
          base64 --decode .integration/npc_v3/trainer/eremita_surdo.png.b64 > graphics/trainers/front_pics/palace_maven_spenser.png

      - name: Restore integration script
        run: |
          base64 --decode .integration/npc_v3/integrate_priority10_npcs_v3.py.gz.b64 | gzip -d > scripts/integrate_priority10_npcs_v3.py
          chmod +x scripts/integrate_priority10_npcs_v3.py

      - name: Integrate NPC assets and story mappings
        run: python3 scripts/integrate_priority10_npcs_v3.py

      - name: Validate priority pack
        run: python3 scripts/validate_priority10_npcs.py

      - name: Run repository safety suite
        run: bash scripts/run_repository_safety.sh /tmp/arauna-npc-v3-safety.log

      - name: Build English ROM
        run: make ARAUNA_LANGUAGE=ENGLISH -j$(nproc) -O all

      - name: Run engine tests
        env:
          TEST: 1
        run: make ARAUNA_LANGUAGE=ENGLISH -j$(nproc) check

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf .integration/npc_v3
          git add --all
          git commit -m "feat(art): integrate priority-10 Arauna NPC pack v3"
          git push origin HEAD:agent/integrate-priority10-npcs-v3
