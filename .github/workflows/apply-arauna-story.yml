name: Apply Arauna story rewrite

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-arauna-story.yml
      - tools/apply_arauna_story.py
      - tools/apply_arauna_story_safe.py

permissions:
  contents: write

jobs:
  rewrite-story:
    if: github.repository == 'lu1234566/pokemon-juramento-de-arauna'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve pre-story state
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_REF='archive/pre-story-rewrite-2026-08-17'
          if git ls-remote --exit-code --heads origin "$BACKUP_REF" >/dev/null 2>&1; then
            echo "Backup $BACKUP_REF already exists; preserving it unchanged."
          else
            git branch "$BACKUP_REF" "$GITHUB_SHA"
            git push origin "$BACKUP_REF"
          fi

      - name: Apply Arauna narrative safely
        run: python3 tools/apply_arauna_story_safe.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f docs/ARAUANA_STORY_IMPLEMENTATION.md
          grep -R -q 'OTACILIO' data/maps
          grep -R -q 'DESENCANTO' data/maps
          grep -R -q 'CONSORCIO HORIZONTE' data/maps
          grep -R -q 'CIRO' data/maps
          grep -R -q 'ANAHI' data/maps

          NON_TEXT_CHANGES="$(git diff --unified=0 -- data/maps | grep -E '^[+-]' | grep -v -E '^(---|\+\+\+|[+-][[:space:]]*\.string )' || true)"
          if [ -n "$NON_TEXT_CHANGES" ]; then
            echo 'Refusing to publish: non-dialogue map-script changes detected.'
            echo "$NON_TEXT_CHANGES"
            exit 1
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build rewritten story with diagnostics
        id: build
        shell: bash
        run: |
          set +e
          make -j2 MODERN=1 COMPARE=0 > arauna-build.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo '===== BUILD LOG TAIL ====='
          tail -n 250 arauna-build.log || true
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arauna-story-build-log
          path: arauna-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Require successful build
        shell: bash
        run: |
          test '${{ steps.build.outputs.status }}' = '0'

      - name: Publish validated story commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET_REF='generated/arauna-story-2026-08-17'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/maps docs/ARAUANA_STORY_IMPLEMENTATION.md
          git commit -m 'Replace Emerald narrative with Juramento de Arauna story'
          git push origin HEAD:"$TARGET_REF" --force
          echo "Published validated story to $TARGET_REF at $(git rev-parse HEAD)"
