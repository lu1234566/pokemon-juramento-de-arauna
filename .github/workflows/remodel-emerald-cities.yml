name: Publish Arauna city remodel V3

on:
  push:
    paths:
      - .github/workflows/remodel-emerald-cities.yml
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remodel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Record Vila Amanhecer hash
        id: vila
        shell: bash
        run: echo "sha=$(sha256sum data/layouts/LittlerootTown/map.bin | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate remaining Arauna cities
        run: python3 tools/remodel_arauna_other_cities_v3.py

      - name: Validate generated maps
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(sha256sum data/layouts/LittlerootTown/map.bin | cut -d' ' -f1)" = "${{ steps.vila.outputs.sha }}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          layouts = json.loads(Path('data/layouts/layouts.json').read_text())['layouts']
          by_id = {x['id']: x for x in layouts}
          cities = [
              'OldaleTown','PetalburgCity','RustboroCity','DewfordTown','SlateportCity',
              'MauvilleCity','VerdanturfTown','FallarborTown','LavaridgeTown','FortreeCity',
              'LilycoveCity','MossdeepCity','SootopolisCity','PacifidlogTown','EverGrandeCity',
          ]
          for city in cities:
              m = json.loads(Path(f'data/maps/{city}/map.json').read_text())
              layout = by_id[m['layout']]
              p = Path(layout['blockdata_filepath'])
              expected = int(layout['width']) * int(layout['height']) * 2
              assert p.stat().st_size == expected, (city, p.stat().st_size, expected)
          assert Path('docs/ARAUNA_OTHER_CITIES_PORYMAP_V3.md').exists()
          print('15/15 city maps validated; Vila Amanhecer preserved')
          PY
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -q '^data/maps/'; then
            echo 'Unexpected map metadata change' >&2
            exit 1
          fi

      - name: Package Porymap city files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out/data/layouts
          for city in OldaleTown PetalburgCity RustboroCity DewfordTown SlateportCity MauvilleCity VerdanturfTown FallarborTown LavaridgeTown FortreeCity LilycoveCity MossdeepCity SootopolisCity PacifidlogTown EverGrandeCity; do
            mkdir -p "out/data/layouts/$city"
            cp "data/layouts/$city/map.bin" "out/data/layouts/$city/map.bin"
            if [ -f "data/layouts/$city/border.bin" ]; then
              cp "data/layouts/$city/border.bin" "out/data/layouts/$city/border.bin"
            fi
          done
          cp docs/ARAUNA_OTHER_CITIES_PORYMAP_V3.md out/
          cat > out/LEIA-ME.txt <<'EOF'
          Pokemon Juramento de Arauna — outras cidades Porymap V3

          Este pacote contém os layouts das 15 cidades/vilas restantes.
          Vila Amanhecer não está incluída porque sua V3 já está integrada separadamente.

          Para testar manualmente, substitua os arquivos equivalentes dentro de data/layouts/ mantendo um backup do projeto atual.
          Eventos, warps, scripts, conexões, IDs e saves não foram alterados por este lote.
          EOF

      - name: Upload Porymap package
        uses: actions/upload-artifact@v4
        with:
          name: arauna-other-cities-porymap-v3
          path: out/
          if-no-files-found: error

      - name: Publish generated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/layouts docs/ARAUNA_OTHER_CITIES_PORYMAP_V3.md
          git commit -m 'Remodel fifteen Arauna cities for Porymap V3'
          git push origin HEAD:generated/arauna-other-cities-porymap-v3 --force
