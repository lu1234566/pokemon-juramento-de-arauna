name: Publish stronger Hoenn city remodel v2

on:
  push:
    paths:
      - .github/workflows/remodel-emerald-cities.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remodel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Generate remodeled cities
        run: python3 tools/remodel_emerald_cities.py

      - name: Validate generated maps
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          cities = ['LittlerootTown','OldaleTown','PetalburgCity','RustboroCity','DewfordTown','SlateportCity','MauvilleCity','VerdanturfTown','FallarborTown','LavaridgeTown','FortreeCity','LilycoveCity','MossdeepCity','SootopolisCity','PacifidlogTown','EverGrandeCity']
          for city in cities:
              json.loads(Path(f'data/maps/{city}/map.json').read_text())
          assert Path('docs/EMERALD_CITY_REMODEL.md').exists()
          print('16/16 city maps validated; same map pipeline already passed a full Emerald build')
          PY

      - name: Publish staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/layouts data/maps docs/EMERALD_CITY_REMODEL.md
          git commit -m 'Remodel all Hoenn cities with vanilla Emerald tiles v2'
          git push origin HEAD:generated/city-remodel --force
